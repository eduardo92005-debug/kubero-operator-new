{{- if and .Values.git.keys .Values.git.keys.priv .Values.git.keys.pub }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kuberobuild.deploymentKeysSecretName" . }}
  annotations:
    app.kubernetes.io/comment: "used by this KuberoBuild to pull the app repository"
type: Opaque
data:
  deploykey: {{ .Values.git.keys.priv | quote }}
  deploykey.pub: {{ .Values.git.keys.pub | quote }}
---
{{- end }}
